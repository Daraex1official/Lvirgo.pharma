<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lvirgo</title>
    <style>
        body {
            margin: 0;
            padding: 15px;
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            box-sizing: border-box;
        }
        
        h1 {
            text-align: center;
            color: #2E8B57;
            margin-bottom: 20px;
        }

        
        .gallery-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            max-width: 1000px;
            margin: 0 auto;
        }

       
        .gallery-row img {
            width: 100%; 
            height: auto; 
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>

    <h1>Lvirgo</h1>

        <img src="catbutt.jpeg" alt="попа">
    </div>

</body>
</html>
